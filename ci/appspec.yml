version: 0.0
os: linux
files:
  - source: /
    destination: /opt/laravel-deploy
file_exists_behavior: OVERWRITE
hooks:
  ApplicationStop:
    - location: scripts/stop-container.sh
      timeout: 60
      runas: root
  AfterInstall:
    - location: scripts/deploy-container.sh
      timeout: 300
      runas: root
  ValidateService:
    - location: scripts/validate-service.sh
      timeout: 60
      runas: root
